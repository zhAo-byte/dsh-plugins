# dsh-remote-control relay — nginx location snippet
#
# Add this *inside* an existing `server { ... }` block that already terminates
# TLS for your domain. Do not create a second server block for the same name;
# that fights whatever is already serving the domain.
#
# The 44-char base64 secrets this project generates fit an nginx location, but
# they do not need to: the relay's own bearer check is the boundary. Keeping the
# same site means one certificate, one HSTS policy, and one place to look when
# something is wrong.

# ── the control page and its API ─────────────────────────────────────────────
# `proxy_buffering off` and the long read timeout are both required: the page
# holds an open SSE stream, and the node holds a long-poll for up to a minute.
# With buffering on, the roster would update in bursts and the page would look
# frozen; with the default 60s read timeout, the node's poll would be cut and it
# would reconnect in a loop.
location /harness/ {
    proxy_pass         http://127.0.0.1:8787/;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Required, not cosmetic. The trailing slash on `proxy_pass` above strips
    # `/harness/`, so the relay only ever sees `/`. Without this header the page
    # would resolve its own API calls against the origin root and be answered by
    # whatever else serves this domain — the page loads and then does nothing.
    proxy_set_header   X-Forwarded-Prefix /harness;

    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # The relay has no form posts and no other origin should ever call it.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
}

# Deliberately nothing else.
#
# An earlier draft appended `if ($host !~ ^icyu\.online$) { return 444; }` as
# "defence in depth". That was wrong and it is worth writing down why, because it
# is a tempting mistake:
#
#   * The relay does not authenticate by Host, so such a check buys no security —
#     the bearer tokens are the boundary, and they do not care what name was used.
#   * On this server the block that holds /play/ and /vpn/ is also reachable as
#     `www.icyu.online` and by bare IP. A stray `if` can therefore break routes
#     that have nothing to do with this project.
#   * `if` inside `location` is a documented nginx footgun; adding one next to an
#     unrelated production site, for no gain, is a bad trade.
#
# Bind the relay to loopback, keep the tokens secret, and leave the rest of the
# server block exactly as it was.
