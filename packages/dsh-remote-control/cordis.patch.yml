# The dsh-remote-control bundle patch: one row, because the whole node is one
# concern — advertise, poll, run.
#
# The row injects nothing at the plugin level on purpose. Its required services
# (`agents`, `agentPresets`, `permissionPresets`, `workspaceRegistry`) are
# resolved with `ctx.inject` inside the plugin, so a composition that lacks them
# still loads the row and logs why it cannot connect, instead of hiding the
# misconfiguration behind a row that never appears.
#
# Disable it from your own patch layer by id:
#
#   - id: remote-control
#     disabled: true
#
# or override any config key:
#
#   - id: remote-control
#     config:
#       enabled: false

- insert:
    # The node: advertises this machine, polls, runs what arrives.
    - id: remote-control
      name: 'dsh-remote-control'

    # The browser half: the configuration card in
    # Settings → Plugins → Plugin configuration.
    #
    # A separate package name on purpose. `dsh-client-modules` composes one browser
    # bundle per Loader row that resolves to a client package, and it rejects two
    # active rows resolving to the same package name — so the card cannot live on
    # the package the host rows already use. Same reason, same shape as the sibling
    # `dsh-codex-bridge-client`.
    - id: remote-control-client
      name: 'dsh-remote-control-client'
